openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Family Budget API for Chege & Lydiah
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: expenses
    description: Expense tracking
  - name: contributions
    description: Monthly contributions
  - name: budget-categories
    description: Budget categories
  - name: dashboard
    description: Dashboard summaries and activity
  - name: members
    description: App access members
  - name: savings-goals
    description: Savings goals tracking
  - name: joint-account
    description: Joint bank account deposits and disbursements
  - name: income-sources
    description: Income source presets per household member

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/display-name:
    put:
      operationId: updateDisplayName
      tags: [auth]
      summary: Save the authenticated user's preferred display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayNameInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /expenses:
    get:
      operationId: getExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - name: month
          in: query
          schema:
            type: number
        - name: year
          in: query
          schema:
            type: number
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /expenses/apply-recurring:
    post:
      operationId: applyRecurringExpenses
      tags: [expenses]
      summary: Copy recurring expenses from the previous month into the current month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRecurringInput"
      responses:
        "200":
          description: Number of expenses copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyRecurringResult"

  /budget-categories:
    get:
      operationId: getBudgetCategories
      tags: [budget-categories]
      summary: List all budget categories with amounts
      responses:
        "200":
          description: Budget categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetCategory"
    post:
      operationId: createBudgetCategory
      tags: [budget-categories]
      summary: Create a budget category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCategoryInput"
      responses:
        "201":
          description: Created budget category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"
        "400":
          description: Invalid category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /budget-categories/{id}:
    put:
      operationId: updateBudgetCategory
      tags: [budget-categories]
      summary: Update a budget category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCategoryUpdateInput"
      responses:
        "200":
          description: Updated budget category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"
        "400":
          description: Invalid category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBudgetCategory
      tags: [budget-categories]
      summary: Delete a budget category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contributions/{id}:
    delete:
      operationId: deleteContribution
      tags: [contributions]
      summary: Delete a contribution by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contributions:
    get:
      operationId: getContributions
      tags: [contributions]
      summary: List contributions
      parameters:
        - name: month
          in: query
          schema:
            type: number
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contribution"
    post:
      operationId: createContribution
      tags: [contributions]
      summary: Record a contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionInput"
      responses:
        "201":
          description: Created contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Monthly budget summary — total budget, total spent, remaining, per-category spent
      parameters:
        - name: month
          in: query
          schema:
            type: number
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent activity feed — latest expenses and contributions
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/category-breakdown:
    get:
      operationId: getDashboardCategoryBreakdown
      tags: [dashboard]
      summary: Spending breakdown per category for a given month
      parameters:
        - name: month
          in: query
          schema:
            type: number
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryBreakdown"

  /dashboard/trends:
    get:
      operationId: getDashboardTrends
      tags: [dashboard]
      summary: Month-over-month spending totals for the last N months
      parameters:
        - name: months
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Monthly trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthTrend"

  /savings-goals:
    get:
      operationId: getSavingsGoals
      tags: [savings-goals]
      summary: List all savings goals
      responses:
        "200":
          description: List of savings goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsGoal"
    post:
      operationId: createSavingsGoal
      tags: [savings-goals]
      summary: Create a new savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsGoalInput"
      responses:
        "201":
          description: Created savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"

  /joint-account:
    get:
      operationId: getJointAccount
      tags: [joint-account]
      summary: Get joint account balance and all transactions
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointAccountSummary"

  /joint-account/deposit:
    post:
      operationId: createDeposit
      tags: [joint-account]
      summary: Deposit money into the joint account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointAccountTransaction"

  /joint-account/disbursement:
    post:
      operationId: createDisbursement
      tags: [joint-account]
      summary: Disburse money from the joint account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisbursementInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointAccountTransaction"

  /joint-account/transfers/to-savings:
    post:
      operationId: transferBankToSavings
      tags: [joint-account]
      summary: Move money from the joint bank account into a savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsTransferInput"
      responses:
        "201":
          description: Linked bank and savings transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointAccountTransaction"

  /joint-account/transfers/from-savings:
    post:
      operationId: transferSavingsToBank
      tags: [joint-account]
      summary: Move money from a savings goal into the joint bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsTransferInput"
      responses:
        "201":
          description: Linked savings and bank transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointAccountTransaction"

  /joint-account/{id}:
    put:
      operationId: updateJointAccountTransaction
      tags: [joint-account]
      summary: Edit a joint account transaction without changing its type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJointAccountTransactionInput"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JointAccountTransaction"
        "400":
          description: Invalid transaction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJointAccountTransaction
      tags: [joint-account]
      summary: Delete a joint account transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /savings-goals/cascade-contribute:
    post:
      operationId: cascadeContribute
      tags: [savings-goals]
      summary: Distribute a payment waterfall-style across multiple savings goals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CascadeContributeInput"
      responses:
        "200":
          description: Allocation breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeContributeResult"

  /savings-goals/{id}/contributions:
    get:
      operationId: getSavingsGoalContributions
      tags: [savings-goals]
      summary: List contribution history for a savings goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsGoalContribution"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /savings-goals/{id}/contribute:
    post:
      operationId: contributeToSavingsGoal
      tags: [savings-goals]
      summary: Atomically add an amount to a savings goal's current balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsGoalContributeInput"
      responses:
        "200":
          description: Updated savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /savings-goals/{id}:
    patch:
      operationId: updateSavingsGoal
      tags: [savings-goals]
      summary: Update a savings goal (name, target, deadline, currentAmount, isCompleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsGoalUpdateInput"
      responses:
        "200":
          description: Updated savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSavingsGoal
      tags: [savings-goals]
      summary: Delete a savings goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /income-sources:
    get:
      operationId: getIncomeSources
      tags: [income-sources]
      summary: List income source presets per household member
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Optional household member ID to filter by
      responses:
        "200":
          description: Income source presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncomeSource"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members:
    get:
      operationId: getMembers
      tags: [members]
      summary: List all members with access to this app
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: addMember
      tags: [members]
      summary: Add a new member by Replit user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid input or member already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /members/{userId}:
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    IncomeSource:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        name:
          type: string
        isMain:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - isMain
        - createdAt

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    DisplayNameInput:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        needsDisplayName:
          type: boolean
      required:
        - id
        - needsDisplayName

    AuthUserEnvelope:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user

    Expense:
      type: object
      properties:
        id:
          type: number
        amount:
          type: number
          description: Amount in KES
        category:
          type: string
        description:
          type: string
        notes:
          type: ["string", "null"]
          description: Optional extra notes
        paidById:
          type: string
        paidByName:
          type: string
        isRecurring:
          type: boolean
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - amount
        - category
        - description
        - paidById
        - paidByName
        - isRecurring
        - date
        - createdAt

    ExpenseInput:
      type: object
      properties:
        amount:
          type: number
        category:
          type: string
        description:
          type: string
        notes:
          type: string
        paidById:
          type: string
          description: User ID of who paid — must be a recognised household member
        isRecurring:
          type: boolean
        date:
          type: string
          format: date
      required:
        - amount
        - category
        - description
        - paidById
        - date

    ApplyRecurringInput:
      type: object
      properties:
        month:
          type: number
          description: Target month (1-12)
        year:
          type: number
          description: Target year
      required:
        - month
        - year

    ApplyRecurringResult:
      type: object
      properties:
        copied:
          type: number
          description: Number of expenses copied
      required:
        - copied

    BudgetCategory:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        budgetAmount:
          type: number
          description: Monthly budget in KES
        priority:
          type: number
          description: 1=survival essentials, 2=health/education, 3=household, 4=connectivity, 5=discretionary
        color:
          type: string
        isRecurring:
          type: boolean
          description: Whether this budget applies every month
        activeMonth:
          type: ["number", "null"]
          description: Month when a one-time budget applies
        activeYear:
          type: ["number", "null"]
          description: Year when a one-time budget applies
      required:
        - id
        - name
        - budgetAmount
        - priority
        - color
        - isRecurring

    BudgetCategoryInput:
      type: object
      properties:
        name:
          type: string
        budgetAmount:
          type: number
          description: Monthly budget in KES; use 0 when creating a category from a withdrawal
        priority:
          type: number
        color:
          type: string
        isRecurring:
          type: boolean
          default: true
        activeMonth:
          type: ["number", "null"]
          minimum: 1
          maximum: 12
        activeYear:
          type: ["number", "null"]
          minimum: 2000
          maximum: 2200
      required:
        - name
        - budgetAmount

    BudgetCategoryUpdateInput:
      type: object
      description: Fields to update. A one-time budget requires both activeMonth and activeYear.
      properties:
        name:
          type: string
        budgetAmount:
          type: number
        priority:
          type: number
        color:
          type: string
        isRecurring:
          type: boolean
        activeMonth:
          type: ["number", "null"]
          minimum: 1
          maximum: 12
        activeYear:
          type: ["number", "null"]
          minimum: 2000
          maximum: 2200

    Contribution:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        userName:
          type: string
        amount:
          type: number
          description: Amount in KES
        month:
          type: number
        year:
          type: number
        note:
          type: ["string", "null"]
        createdAt:
          type: string
