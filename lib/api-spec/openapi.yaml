        date:
          type: string
          format: date
        madeById:
          type: ["string", "null"]
        incomeSourceId:
          type: ["number", "null"]
          description: Preserved for deposits unless explicitly changed
        expenseCategory:
          type: string
          description: Required for withdrawals; deposits ignore this field
        sourceKind:
          type: string
          enum: [income_source, other]
        destinationKind:
          type: string
          enum: [category, other]
      required:
        - amount
        - date

