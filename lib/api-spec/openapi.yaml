      properties:
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          description: Positive KES amount with up to two decimal places
        description:
          type: string
        date:
          type: string
          format: date
        madeById:
          type: ["string", "null"]
          description: >
            ID of the household member responsible for this disbursement. Omit
            or pass null for Joint bank. Must be a valid household member ID
            when non-null.
        expenseCategory:
          type: string
          description: Required budget category this disbursement is paying for
        destinationKind:
          type: string
          enum: [category, other]
          description: Choose other only when the required description is a narration.
        accountId:
          type: number
          minimum: 1
      required:
        - amount
        - date
        - expenseCategory

    BankChargeInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
        narration:
          type: string
          minLength: 1
          maxLength: 200
          description: Required explanation from the bank statement, for example monthly account fee
        date:
          type: string
          format: date
        accountId:
          type: number
          minimum: 1
      required:
        - amount
        - narration
        - date

    UpdateJointAccountTransactionInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
        description:
          type: string
          description: Optional supporting detail; withdrawals fall back to their category
        date:
          type: string
          format: date
        madeById:
          type: ["string", "null"]
        incomeSourceId:
          type: ["number", "null"]
          description: Preserved for deposits unless explicitly changed
        expenseCategory:
          type: string
          description: Required for withdrawals; deposits ignore this field
        bankCharge:
          type: boolean
          description: True only while editing an existing bank-charge transaction
        sourceKind:
          type: string
          enum: [income_source, other]
        destinationKind:
          type: string
          enum: [category, other]
        contributorSplits:
          type: array
          description: Replacement contributor portions for a deposit. Send an empty array to remove existing splits.
          items:
            $ref: "#/components/schemas/DepositContributorSplit"
        transferDirection:
          type: string
          enum: [to_savings, from_savings]
          description: Required when editing a linked savings transfer
        goalId:
          type: number
          minimum: 1
          description: Savings goal receiving or supplying an edited transfer
        narration:
          type: string
          minLength: 1
          maxLength: 200
          description: Required when editing a linked savings transfer
        accountId:
          type: number
          minimum: 1
      required:
        - amount
        - date

    SavingsTransferInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          description: Savings goals currently use whole KES amounts
        goalId:
          type: number
          minimum: 1
        narration:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
        madeById:
          type: ["string", "null"]
        accountId:
          type: number
          minimum: 1
      required:
        - amount
        - goalId
        - narration
        - date

    BankToBankTransferInput:
      type: object
      properties:
        sourceAccountId:
          type: number
          minimum: 1
        destinationAccountId:
          type: number
          minimum: 1
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
        narration:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date
      required: [sourceAccountId, destinationAccountId, amount, narration, date]

    BankToBankTransferResult:
      type: object
      properties:
        transferId:
          type: string
        outgoing:
          $ref: "#/components/schemas/JointAccountTransaction"
        incoming:
          $ref: "#/components/schemas/JointAccountTransaction"
      required: [transferId, outgoing, incoming]

    BankAccount:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        accountNumber: { type: ["string", "null"] }
        openingBalance: { type: number }
        openingBalanceDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
      required: [id, name, accountNumber, openingBalance, createdAt]

    BankAccountInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        accountNumber: { type: string, minLength: 1, maxLength: 40 }
        openingBalance: { type: number, minimum: 0, multipleOf: 0.01 }
        openingBalanceDate: { type: string, format: date }
      required: [name]

    BankAccountUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        accountNumber: { type: ["string", "null"], minLength: 1, maxLength: 40 }
        openingBalance: { type: number, minimum: 0, multipleOf: 0.01 }
        openingBalanceDate: { type: string, format: date }

    SavingsGoalInput:
      type: object
      properties:
        name:
          type: string
        targetAmount:
          type: number
        deadline:
          type: string
          format: date
          description: Optional deadline date
      required:
        - name
        - targetAmount

    ContributorSplit:
      type: object
      description: Attribution of a portion of a cascade contribution to one member or the Joint bank
      properties:
        userId:
          type: ["string", "null"]
          description: >
            Household member ID, or null for Joint bank. Must be a valid member
            ID when non-null.
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          description: Amount attributed to this contributor (whole KES only; positive integer)
      required:
        - userId
        - amount

    CascadeContributeInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          description: Total payment amount to distribute (whole KES only; positive integer)
        goalIds:
          type: array
          items:
            type: number
          description: Optional ordered list of goal IDs; defaults to all active goals by creation date
        contributorSplits:
          type: array
          items:
            $ref: "#/components/schemas/ContributorSplit"
          description: >
            Optional attribution splits. When provided the sum of all split
            amounts must equal the total amount. Each goal allocation is
            recorded as one contribution row per split proportionally.
            Omit (or omit the field entirely) to record the whole contribution
            as Joint bank.
      required:
        - amount

    CascadeContributeAllocation:
      type: object
      properties:
        goalId:
          type: number
        goalName:
          type: string
        allocated:
          type: number
        newTotal:
          type: number
        completed:
          type: boolean
      required:
        - goalId
        - goalName
        - allocated
        - newTotal
        - completed

    CascadeContributeResult:
      type: object
      properties:
        totalAmount:
          type: number
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/CascadeContributeAllocation"
        leftover:
          type: number
      required:
        - totalAmount
        - allocations
        - leftover

    SavingsGoalContribution:
      type: object
      properties:
        id:
          type: number
        goalId:
          type: number
        amount:
          type: number
          description: Amount contributed in KES
        note:
          type: ["string", "null"]
          description: Optional note — "Manual adjustment" for balance corrections
        createdByUserId:
          type: ["string", "null"]
          description: Household member ID, or null for Joint bank
        contributorName:
          type: string
          description: >
            Display name of the contributor. "Joint bank" when createdByUserId
            is null.
        createdAt:
          type: string
      required:
        - id
        - goalId
        - amount
        - createdByUserId
        - contributorName
        - createdAt

    SavingsGoalContributeInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          description: Amount to add to the goal (whole KES only; positive integer)
        userId:
          type: ["string", "null"]
          description: >
            ID of the household member making this contribution. Omit or pass
            null to attribute to the Joint bank (shared). Must be a valid
            household member ID when non-null. Cannot be combined with
            contributorSplits.
        contributorSplits:
          type: array
          items:
            $ref: "#/components/schemas/ContributorSplit"
          description: >
            Optional attribution splits. When provided the sum of all split
            amounts must equal amount exactly, and userId must be omitted. Each
            split is recorded as a separate contribution row (proportionally
            reduced when the goal cap limits the applied amount). Omit to record
            the whole contribution against userId (or Joint bank when userId is
            also omitted).
      required:
        - amount

    SavingsGoalUpdateInput:
      type: object
      properties:
        name:
          type: string
        targetAmount:
          type: number
        currentAmount:
          type: number
        deadline:
          type: ["string", "null"]
          format: date
        isCompleted:
          type: boolean
        reason:
          type: string
          description: Required when currentAmount correction reduces the balance by more than 50%
