        totalDisbursements:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/JointAccountTransaction"
      required:
        - balance
        - totalDeposits
        - totalDisbursements
        - transactions

    DepositInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          description: Whole KES only; must be a positive integer amount
        description:
          type: string
        date:
          type: string
          format: date
        madeById:
          type: ["string", "null"]
          description: >
            ID of the household member who made this deposit. Omit or pass null
            to attribute to the Joint bank (shared). Must be a valid household
            member ID when non-null.
        incomeSourceId:
          type: number
          minimum: 1
          description: >
            Optional income-source preset that funded this deposit. Used only
            with a single named depositor.
        sourceKind:
          type: string
          enum: [income_source, other]
          description: Choose other only when the required description is a narration.
      required:
        - amount
        - description
        - date

    DisbursementInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
          multipleOf: 1
          description: Whole KES only; must be a positive integer amount
        description:
          type: string
        date:
          type: string
          format: date
        madeById:
          type: ["string", "null"]
          description: >
            ID of the household member responsible for this disbursement. Omit
            or pass null for Joint bank. Must be a valid household member ID
            when non-null.
        expenseCategory:
          type: string
          description: Required budget category this disbursement is paying for
        destinationKind:
          type: string
          enum: [category, other]
          description: Choose other only when the required description is a narration.
