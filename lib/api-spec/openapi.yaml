components:
  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: number
    InvitationContactId:
      name: id
      in: path
      required: true
      schema:
        type: number
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
  schemas:
    ParseMpesaMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 20000
          description: An anonymized M-Pesa message. Do not include real phone numbers or other personal information.
      required:
        - message

    MpesaTransaction:
      type: object
      properties:
        transactionId:
          type: ["string", "null"]
        transactionType:
          type: ["string", "null"]
          enum: [person_payment, person_receipt, merchant_payment, paybill_payment, airtime_purchase, cash_withdrawal, cash_deposit, bank_transfer, reversal, failed, other, null]
        purchaseCategory:
          type: ["string", "null"]
          enum: [postpaid_bundle, minutes, airtime, gift, wifi, null]
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        merchantOrCounterparty:
          type: ["string", "null"]
        accountReference:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
          format: date
        time:
          type: ["string", "null"]
        mpesaBalance:
          type: ["number", "null"]
        fee:
          type: ["number", "null"]
        parserVersion:
          type: string
        confidence:
          type: string
          enum: [high, medium, low, none]
        parseWarnings:
          type: array
          items:
            type: string
      required:
        - transactionId
        - transactionType
        - purchaseCategory
        - amount
        - currency
        - merchantOrCounterparty
        - accountReference
        - phoneNumber
        - date
        - time
        - mpesaBalance
        - fee
        - parserVersion
        - confidence
        - parseWarnings

    MpesaParseResult:
      type: object
      properties:
        status:
          type: string
          enum: [parsed, unsupported, invalid]
        transaction:
          oneOf:
            - $ref: "#/components/schemas/MpesaTransaction"
            - type: "null"
        confidence:
          type: string
          enum: [high, medium, low, none]
        warnings:
          type: array
          items:
            type: string
        normalizedMessage:
          type: string
          description: Normalized text returned for debugging parser rules; personal-looking numbers are redacted.
      required:
        - status
        - transaction
        - confidence
        - warnings
        - normalizedMessage

    IncomeSource:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        name:
          type: string
        isMain:
          type: boolean
        expectedMonthlyAmount:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - isMain
        - expectedMonthlyAmount
        - createdAt

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    DisplayNameInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Printable Unicode display name without control characters or line breaks
      required:
        - name

    ProfilePhotoInput:
      type: object
      properties:
        photoPath:
          type: ["string", "null"]
          pattern: "^/objects/photos/[a-f0-9-]+$"
      required: [photoPath]

    RequestPhotoUploadInput:
      type: object
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: number
          minimum: 1
          maximum: 15728640
      required: [contentType, size]

    PhotoUploadUrlResponse:
      type: object
      properties:
        objectPath:
          type: string
          pattern: "^/objects/photos/[a-f0-9-]+$"
        uploadUrl:
          type: string
        uploadMethod:
          type: string
          enum: [PUT, POST]
        uploadFields:
          type: object
          additionalProperties:
            type: string
      required: [objectPath, uploadUrl, uploadMethod]

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        needsDisplayName:
          type: boolean
      required:
        - id
        - needsDisplayName

    AuthUserEnvelope:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user

    Expense:
      type: object
      properties:
        id:
          type: number
        amount:
          type: number
          description: Amount in KES
        category:
          type: string
          description: Compatibility/display primary category. Empty when the expense is uncategorized; for allocated expenses this is the first allocation category.
        categoryAllocations:
          type: array
          description: Category portions. Empty when the expense is uncategorized; legacy categorized expenses without stored portions are returned as one portion using category and amount.
          items:
            $ref: "#/components/schemas/ExpenseCategoryAllocation"
        description:
          type: string
        notes:
          type: ["string", "null"]
          description: Optional extra notes
        paidById:
          type: ["string", "null"]
        paidByName:
          type: ["string", "null"]
        paidFromBank:
          type: boolean
        accountId:
          type: ["number", "null"]
          description: Bank account funding this expense when applicable.
        incomeSplits:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseFundingSplit"
        isRecurring:
          type: boolean
        date:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - amount
        - category
        - categoryAllocations
        - description
        - paidById
        - paidByName
        - accountId
        - isRecurring
        - date
        - createdAt

    ExpenseInput:
      type: object
      properties:
        amount:
          type: number
        category:
          type: string
          description: Optional compatibility/display primary category. Omit or leave blank for an uncategorized expense. When non-empty allocations are supplied, defaults to and must match the first allocation category. "Uncategorized" is reserved internally and cannot be submitted as a category.
        categoryAllocations:
          type: array
          description: Optional whole-KES category portions. Amounts must total amount exactly and each category can appear once.
          items:
            $ref: "#/components/schemas/ExpenseCategoryAllocation"
        description:
          type: string
        notes:
          type: string
        paidById:
          type: ["string", "null"]
          description: Legacy single-payer attribution. Omit for split-funded or bank-account expenses.
        paidFromBank:
          type: boolean
          description: Legacy single-source bank-account flag. Use incomeSplits for a mixed payment.
        accountId:
          type: ["number", "null"]
          minimum: 1
          description: Selected bank account for bank funding. Omit to use the workspace's first account.
        incomeSourceId:
          type: number
          minimum: 1
          description: Required for a personal expense unless paidFromBank is true. Must belong to paidById.
        incomeSplits:
          type: array
          description: Whole-KES funding portions. Their amounts must equal amount exactly. Every direct portion requires incomeSourceId; bank-account portions must not include one.
          items:
            $ref: "#/components/schemas/ExpenseFundingSplit"
        isRecurring:
          type: boolean
        date:
          type: string
          format: date
      required:
        - amount
        - description
        - date

    ExpenseFundingSplit:
      type: object
      properties:
        userId:
          type: ["string", "null"]
          description: Household member who funded this portion. Null only for Joint bank.
        label:
          type: string
          description: Optional readable source label retained for history.
        amount:
          type: number
          minimum: 1
          multipleOf: 1
