kind = "web"
previewPath = "/"
title = "Jamvi Website"
description = "The public Jamvi website for personal budgets and transparent shared money across families, chamas, churches, clubs, teams, and other groups."
version = "1.0.0"
id = "artifacts/jamvi-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 29056

[services.development]
run = "pnpm --filter @workspace/jamvi-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jamvi-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/jamvi-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "29056"
BASE_PATH = "/"
