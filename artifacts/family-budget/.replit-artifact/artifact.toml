kind = "web"
previewPath = "/app/"
title = "Jamvi"
description = "Jamvi — a personal and shared-money workspace for families, chamas, churches, clubs, teams, and other groups. Track budgets, expenses, contributions, savings goals, and pooled funds in separate workspaces."
version = "1.0.0"
id = "artifacts/family-budget"
router = "path"

[[services]]
name = "web"
paths = [ "/app/" ]
localPort = 25043

[services.development]
run = "corepack pnpm@11.20.0 --filter @workspace/family-budget run dev"

[services.production]
build = [ "corepack", "pnpm@11.20.0", "--filter", "@workspace/family-budget", "run", "build" ]
serve = "static"
publicDir = "artifacts/family-budget/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25043"
BASE_PATH = "/app/"
