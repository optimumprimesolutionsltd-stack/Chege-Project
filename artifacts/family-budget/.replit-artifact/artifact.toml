kind = "web"
previewPath = "/"
title = "Family Budget"
description = "Jamvi web app — personal and group money management. Members sign in to track budgets, expenses, contributions, savings goals and a shared joint account, with each workspace keeping its own financial data."
version = "1.0.0"
id = "artifacts/family-budget"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25043

[services.development]
run = "pnpm --filter @workspace/family-budget run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-budget", "run", "build" ]
serve = "static"
publicDir = "artifacts/family-budget/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25043"
BASE_PATH = "/"
