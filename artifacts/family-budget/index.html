<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      // Before the app loads, so the first paint is already right. A choice of
      // white or Jamvi night wins; otherwise this device's own light/dark.
      try {
        const appearance = localStorage.getItem("jamvi:appearance");
        const deviceDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isMidnight = appearance === "midnight" || (appearance !== "white" && deviceDark);
        document.documentElement.classList.toggle("dark", isMidnight);
        document.documentElement.dataset.appearance = isMidnight ? "midnight" : "white";
      } catch {}
    </script>
    <title>Jamvi</title>
    <meta name="description" content="Personal and shared budgeting, together. Jamvi helps you manage your own money and the money you share." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Jamvi" />
    <meta property="og:description" content="Personal and shared budgeting, together." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jamvi" />
    <meta name="twitter:description" content="Personal and shared budgeting, together." />
    <link rel="icon" type="image/png" href="%BASE_URL%branding/jamvi-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
