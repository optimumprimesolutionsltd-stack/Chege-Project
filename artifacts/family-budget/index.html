<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      try {
        const appearance = localStorage.getItem("jamvi:appearance");
        const isMidnight = appearance !== "white";
        document.documentElement.classList.toggle("dark", isMidnight);
        document.documentElement.dataset.appearance = isMidnight ? "midnight" : "white";
      } catch {}
    </script>
    <title>Jamvi</title>
    <meta name="description" content="Shared finances, together." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Jamvi" />
    <meta property="og:description" content="Shared finances, together." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jamvi" />
    <meta name="twitter:description" content="Shared finances, together." />
    <link rel="icon" type="image/png" href="%BASE_URL%branding/jamvi-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
