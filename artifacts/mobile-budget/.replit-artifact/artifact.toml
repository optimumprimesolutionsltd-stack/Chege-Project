kind = "mobile"
previewPath = "/mobile-budget/"
title = "Jamvi Mobile"
description = "Jamvi Mobile — a mobile companion for personal and shared-money workspaces. Log expenses, view budgets, track goals, and follow activity for the selected workspace."
version = "1.0.0"
id = "artifacts/mobile-budget"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile-budget/" ]
localPort = 25707

[services.development]
run = "corepack pnpm@11.20.0 --filter @workspace/mobile-budget run dev"

[services.production]
build = [ "corepack", "pnpm@11.20.0", "--filter", "@workspace/mobile-budget", "run", "build" ]
run = [ "corepack", "pnpm@11.20.0", "--filter", "@workspace/mobile-budget", "run", "serve" ]

[services.env]
PORT = "25707"
BASE_PATH = "/mobile-budget/"
