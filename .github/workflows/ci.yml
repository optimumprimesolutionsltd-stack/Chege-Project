name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://placeholder/placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Old product name must not reappear
        run: |
          if git grep -In -i 'bajeti' -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "::error::The old name 'bajeti' is back in the files listed above. The product is Jamvi."
            exit 1
          fi
          echo "Clean."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - run: pnpm run typecheck

      - name: API test suite
        run: pnpm --filter @workspace/api-server run test
