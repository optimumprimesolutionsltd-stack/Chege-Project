name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://placeholder/placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Old product name must not reappear
        run: |
          if git grep -In -i 'bajeti' -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "::error::The old name 'bajeti' is back in the files listed above. The product is Jamvi."
            exit 1
          fi
          echo "Clean."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - run: pnpm run typecheck

      # Every package with tests, not just the API. The web and mobile suites
      # were running only on developer machines, which means on nobody's after
      # a busy day.
      - name: Test suites
        run: pnpm -r --if-present run test

      # Builds exactly what Render builds, with the same command, so a break
      # here is a break there. Worth its two minutes: Render has autoDeploy
      # off and a person presses Deploy, so a broken build is discovered by
      # whoever is deploying, at the moment they wanted it live.
      #
      # The website build ends in verify-build.mjs, which asserts the
      # pre-rendered pages actually contain markup. A build can exit 0 having
      # emitted blank pages, and did.
      - name: Build what Render builds
        run: pnpm run build:render

  staging-category-verification:
    name: Verify staging category integrity
    # Do not expose the staging credential to code from forked repositories.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
      - name: Require staging secret
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "::error::Repository secret STAGING_DATABASE_URL is not configured. Add it before relying on this PR check."
            exit 1
          fi
          echo "Staging database secret is configured."
      - name: Verify staging category integrity
        run: pnpm --filter @workspace/scripts verify:staging-categories
