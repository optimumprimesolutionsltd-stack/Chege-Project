# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This file describes what is actually running. An earlier version described a
# staging/production split that was never built: it named the live service as
# following a "staging" branch that does not exist, and declared a second
# service that was never created. Applying it would have repointed production
# at a missing branch.
#
# The database is deliberately not declared here. jamvi-db already exists and
# holds real data; a Blueprint apply must never be able to create, replace, or
# resize it. It is managed in the dashboard only.
#
# Secrets are never listed here. Anything marked `sync: false` has no value in
# the repository; Render prompts for it when the Blueprint is applied and
# stores it on the service.

services:
  # Production. Serves both the website and the app from one service, and
  # answers on the custom domain and on its generated Render hostname.
  - type: web
    name: jamvi
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Every push to main goes live within minutes, with no human review step
    # in between. This was turned off after an incident on 31 August: a sync
    # commit reverted a day of work and this very setting, then auto-deployed
    # itself to production before anyone noticed. Turned back on 16 September
    # by explicit request, accepting that risk. If a bad commit reaches main
    # unreviewed again, this is why it went live.
    autoDeploy: true
    buildCommand: corepack pnpm@11.20.0 install --frozen-lockfile --prod=false --config.strictDepBuilds=false && corepack pnpm@11.20.0 run build:render
    startCommand: corepack pnpm@11.20.0 --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: AUTH_PROVIDER
        value: google
      - key: ISSUER_URL
        value: https://accounts.google.com
      - key: PHOTO_STORAGE_PROVIDER
        value: s3

      # The public origin. Sign-in and the session cookie belong to this host.
      - key: APP_ORIGIN
        sync: false
      - key: APP_URL
        sync: false

      # Other hostnames this same service answers on, comma separated. Without
      # it, sign-in from the Render hostname redirects to APP_ORIGIN instead of
      # completing where it started. Any host listed here must also be a
      # registered redirect URI in the Google OAuth client.
      - key: ADDITIONAL_ORIGINS
        sync: false

      # Read-only bearer token for GET /api/crm/subscriptions — the Optimum
      # Prime CRM's scheduled sync pulls this with
      # `Authorization: Bearer <value>` (its own env var there is
      # JAMVI_SYNC_KEY, holding the same secret). Absent = the endpoint
      # returns 403 to every caller; nothing else reads this route.
      - key: CRM_SYNC_KEY
        sync: false

      # POST /api/feedback relays here — the Optimum Prime CRM's
      # receiveProductFeedback Cloud Function. FEEDBACK_CRM_KEY must match
      # that function's FEEDBACK_INGEST_KEY. Absent = feedback answers
      # "not configured" instead of being silently dropped.
      - key: FEEDBACK_CRM_URL
        sync: false
      - key: FEEDBACK_CRM_KEY
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INVITATION_FROM_EMAIL
        sync: false
      - key: DIGEST_FROM_EMAIL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Safaricom Daraja — Lipa Na M-Pesa Online (STK Push) for subscriptions.
      # Absent = /payments/stk-push returns "not configured" and nobody can
      # subscribe; the read-only-on-lapse rule stays armed but never fires.
      # MPESA_ENV defaults to sandbox (see mpesaConfig() in mpesa.ts), so
      # production billing needs it set to "production" explicitly, in the
      # Render dashboard. `sync: false` here is load-bearing: without it, this
      # entry's hardcoded `value: sandbox` overwrote the dashboard's
      # "production" setting on every blueprint sync, silently reverting
      # payments to sandbox no matter how many times it was set back.
      # MPESA_CALLBACK_URL is the public URL Safaricom POSTs the result to:
      # https://jamvi.co.ke/api/mpesa/callback
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
