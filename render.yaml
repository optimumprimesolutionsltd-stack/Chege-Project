# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This file describes what is actually running. An earlier version described a
# staging/production split that was never built: it named the live service as
# following a "staging" branch that does not exist, and declared a second
# service that was never created. Applying it would have repointed production
# at a missing branch.
#
# The database is deliberately not declared here. jamvi-db already exists and
# holds real data; a Blueprint apply must never be able to create, replace, or
# resize it. It is managed in the dashboard only.
#
# Secrets are never listed here. Anything marked `sync: false` has no value in
# the repository; Render prompts for it when the Blueprint is applied and
# stores it on the service.

services:
  # Production. Serves both the website and the app from one service, and
  # answers on the custom domain and on its generated Render hostname.
  - type: web
    name: jamvi
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    # Production does not move on its own. Two agents push to main, and with
    # autoDeploy on, whatever either of them landed was live in three minutes
    # with nobody deciding. Pushes still reach GitHub and still run CI; a person
    # presses Deploy in the dashboard when the change is meant to reach users.
    autoDeploy: false
    buildCommand: corepack pnpm@11.20.0 install --frozen-lockfile --prod=false --config.strictDepBuilds=false && corepack pnpm@11.20.0 run build:render
    startCommand: corepack pnpm@11.20.0 --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: AUTH_PROVIDER
        value: google
      - key: ISSUER_URL
        value: https://accounts.google.com
      - key: PHOTO_STORAGE_PROVIDER
        value: s3

      # The public origin. Sign-in and the session cookie belong to this host.
      - key: APP_ORIGIN
        sync: false
      - key: APP_URL
        sync: false

      # Other hostnames this same service answers on, comma separated. Without
      # it, sign-in from the Render hostname redirects to APP_ORIGIN instead of
      # completing where it started. Any host listed here must also be a
      # registered redirect URI in the Google OAuth client.
      - key: ADDITIONAL_ORIGINS
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INVITATION_FROM_EMAIL
        sync: false
      - key: DIGEST_FROM_EMAIL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
